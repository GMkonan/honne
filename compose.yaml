services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_PATH: /data/media.json
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PROFILE_NAME: ${PROFILE_NAME-My Library}
      PROFILE_AVATAR_URL: ${PROFILE_AVATAR_URL:-}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_CONTACT_EMAIL: ${APP_CONTACT_EMAIL:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      ANILIST_API_URL: ${ANILIST_API_URL:-https://graphql.anilist.co}
      OPEN_LIBRARY_API_URL: ${OPEN_LIBRARY_API_URL:-https://openlibrary.org}
      TMDB_API_URL: ${TMDB_API_URL:-https://api.themoviedb.org/3}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
      ANILIST_REDIRECT_URL: ${ANILIST_REDIRECT_URL:-}
      ANILIST_DELETE_ON_LOCAL_DELETE: ${ANILIST_DELETE_ON_LOCAL_DELETE:-true}
    volumes:
      - honne-data:/data
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HONNE_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  honne-data:
